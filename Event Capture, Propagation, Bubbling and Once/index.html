<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Understanding JavaScript's Capture</title>
</head>
<body class="bod">

  <div class="one">
    <div class="two">
      <div class="three">
      </div>
    </div>
  </div>

<style>
  html {
    box-sizing: border-box;
  }

  *, *:before, *:after {
    box-sizing: inherit;
  }

  div {
    width: 100%;
    padding: 100px;
  }

  .one {
    background: thistle;
  }

  .two {
    background: mistyrose;
  }

  .three {
    background: coral;
  }
</style>

<button></button>
<script>

    // EVENT CAPTURE: It goes from top to bottom, captures events from the top element ie html to the bottom ie where its clicked
    // EVENT BUBBLING: It goes from bottom to top, captures events from the bottom element ie the one that is clicked to the top element ie html
    // PROPAGATION: Stop bubbling and give us the exact element that we click on, by default event capture is false and bubbling is enabled;
    // ONCE: It will listen for a click and then unbind itself, meaning unbind the eventListener so the event ie click only runs once
    
    const divs = document.querySelectorAll('div');

    function logText(e) {
        console.log(this.classList.value);
        //e.stopPropagation(); // stops bubbling
    }

    divs.forEach(div => div.addEventListener('click', logText, {
        // capture: true  //This will turn on capture and the result will be top to bottom, with stop propagation this will give us just the first element 
        capture: false,
        once: true
    }))


</script>
</body>
</html>
